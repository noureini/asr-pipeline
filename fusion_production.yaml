# =============================================================================
# Production pipeline: two-witness fusion (shared by every language)
# =============================================================================
#   CTC witness (sound)  +  Whisper witness (structure, N-best x3)
#     -> Gemma-3-12B-it Q4 reconciles both, translates to English and labels
#        each turn ENUMERATOR / RESPONDENT in ONE call -> deterministic guards
#
# The language-specific parts (the two witness models, the judge prompt, the
# allowed scripts) live in languages/<code>.yaml and are picked by `-l`:
#   just fusion interview.m4a ben
# This file holds what is shared: VAD, the judge model, decoding, guards.
# =============================================================================

pipeline:
  device: "cuda"
  compute_type: "float16"
  batch_size: 8
  num_workers: 4
  output_dir: "./outputs/v2_deliverable"
  low_vram: true

preprocessing:
  target_sample_rate: 16000
  mono: true
  resampler: "soxr"               # high-quality artifact-free resample
  loudness_normalization:
    enabled: false
  vad:                            # rate-adaptive + recall-leaning (A/B-validated, Stage 1)
    enabled: true
    threshold: 0.45
    min_speech_duration_ms: 250
    min_silence_duration_ms: 350
  chunking:
    max_duration_s: 15
    overlap_s: 2
  noise_reduction:
    enabled: false

diarization:
  # OFF by design: no voice clustering. The fusion LLM (Stage 6b) labels each
  # turn ENUMERATOR / RESPONDENT from what is said, and splits a segment that
  # holds both a question and its answer. (The multilingual path keeps
  # pyannote diarization — see src/asr_pipeline/default.yaml.)
  enabled: false

alignment:
  # OFF by design: the CTC witness emits native word timestamps (validated CLEAN —
  # 534/534, 0 issues), so no forced aligner is needed. MMS_FA is a no-op on
  # Bengali (strips non-Latin); arijitx wav2vec2 was A/B-tested (2026-06-25) and
  # DRIFTS ~2.15s median on this 8kHz dialectal audio, scrambling speaker
  # attribution. CTC-native timestamps are the source of truth.
  enabled: false                 # forced alignment disabled (CTC word times used directly)

# ---------------------------------------------------------------------------
# Stage 6: two-witness fusion + translation + speaker roles (one Gemma call)
# ---------------------------------------------------------------------------
postprocessing:
  translation_backend: "fusion"
  fusion:
    gguf_repo: "unsloth/gemma-3-12b-it-GGUF"
    gguf_file: "gemma-3-12b-it-UD-Q4_K_XL.gguf"
    gguf_revision: "d15e4c7dc21dc55d56bf8549db57a71ad8a2a35d"     # pinned HF commit
    gguf_n_gpu_layers: -1        # all on GPU (12B Q4 fits 8GB)
    # ── generation hyperparameters ──
    # temp=0 (GREEDY) — chosen on EVIDENCE, not the Gemma-rec default (1.0).
    # Two findings (2026-06-25): (1) a clean temp-only A/B showed temp=0 vs 1.0
    # is a WASH on accuracy once repeat_penalty=1.0; (2) the decisive near-empty
    # test — on a backchannel segment where BOTH witnesses said only "okay okay",
    # temp=1.0 confabulated a fabricated survey turn in 2 of 3 runs (an invented
    # year, then a Devanagari token), while temp=0 stayed grounded every time and
    # gave the LOWEST flag count. So greedy loses no accuracy and gains
    # confabulation-resistance. repeat_penalty MUST stay 1.0 — the llama-cpp
    # default 1.1 penalises the legitimate repetition in dialectal speech and
    # drops repeated entities (e.g. সুরমা নদী). top_k/top_p/min_p are inert at
    # temp=0 (argmax) but kept for parity. The deterministic GER + foreign-script
    # guards run after generation as defence-in-depth.
    temperature: 0.0             # greedy — see note above (NOT the Gemma-rec 1.0)
    top_p: 0.95
    top_k: 64
    min_p: 0.0                   # override llama's 0.05 default
    repeat_penalty: 1.0          # MUST stay 1.0
    seed: 1234                   # covers rare argmax ties + the CT2 sampler
    # KV-cache sizing — the fix for the 105-min stage. 8192 over-
    # allocated a 3GB KV cache that overcommitted the 8GB card → PCIe
    # paging → ~4 tok/s. 2048 + flash + q8 KV fits on-card → ~3x+.
    n_ctx: 2048
    flash_attn: true
    kv_quant: true               # q8 KV: near-lossless, fits 8GB fast,
                                 # leaves room for N-best prompts
    whisper_nbest: 3             # Whisper top-3 hypotheses → N-best fusion
    fusion_max_tokens: 1024      # bounded <think> + [bn] + [en] + headroom
    # GER guard: constrain fused [bn] to the witness pool. number-abstain +
    # agreement flags are always on; snap is OFF until calibrated.
    ger_guard: true
    ger_snap: false        # observe-mode first → calibrate ger_snap_tau
    ger_snap_tau: 0.72     # set from scripts/ger_calibrate.py, then ger_snap: true
    # Roles: labelled per turn inside this same fusion call (@ENUMERATOR /
    # @RESPONDENT, defined in the language profile's prompt). No diarization.
    # ── fusion backend ──
    # "server" continuous batching only helps a SMALL model that leaves
    # VRAM for KV slots (4B/8B). The 12B fills 8GB and PAGES with slots
    # (decode 1.75 tok/s — proven). So keep "inprocess" for the 12B.
    fusion_backend: "inprocess"
    n_parallel: 3

output:
  format: "all"                  # txt + json + srt
  transcription_style: "intelligent_verbatim"
  include_raw_text: true
  include_translation: true
  timestamp_format: "HH:MM:SS"
