# =============================================================================
# Nepali — DRAFT profile (not yet validated on survey audio)
# =============================================================================
# Used by:  just setup-models nep  &&  just fusion interview.m4a nep
# Shared settings (Gemma judge, VAD, decoding, guards): fusion_production.yaml
#
# Chosen by measurement (scripts/witness_complementarity.py, 100 FLEURS
# Nepali clips, see README "Choosing models for a new language"): the best
# CTC witness and the best Whisper witness among open Nepali models, trained
# on different data. Together they leave ~17% of reference words that
# neither got right (Bengali pair: 13.5%; previous AI Lab pair: 26%).
#
# Status: judge prompt still needs a native-speaker review; the pipeline must
# be validated on 20-30 real interview segments before use.
# Caveats:
#   - Witness 1 is gated on Hugging Face (accept its terms; HF_TOKEN needed
#     for the one-time download) and needs language_head (AI4Bharat fork).
#   - Its training data is not published (most likely IndicVoices: Nepali
#     as spoken in India). Witness 2: Nepali YouTube (80%) + OpenSLR (20%).
#   - Both trained mostly on wideband audio, not 8 kHz phone recordings.
# =============================================================================
code: nep
name: Nepali
tag: ne                       # [ne] lines in the judge reply and transcript

# Witness 1 · sound: AI4Bharat Nepali IndicConformer (MIT), CTC head.
# FLEURS 100 clips: 27.9% WER (other open Nepali CTC models: 38-40%).
witness_ctc:
  backend: nemo
  model: ai4bharat/indicconformer_stt_ne_hybrid_ctc_rnnt_large
  revision: cd09ba7720f3b17d259f6bfd03e1463bc5ba517d
  nemo_file: indicconformer_stt_ne_hybrid_rnnt_large.nemo
  decoder: ctc
  language_head: ne           # multi-softmax checkpoint (AI4Bharat NeMo fork)
  batch_size: 8

# Witness 2 · structure: Sagarmatha V6, Whisper large-v3-turbo fine-tuned on
# 1,285 h of Nepali (Apache-2.0). FLEURS 100 clips: 25.4% WER. Mode tokens:
# mixed script (English kept in Latin), verbatim style.
witness_whisper:
  model: tonibirat/sagarmatha-v6-nepali-asr
  revision: 20c76b656a3594469235e2a869690288b884dfd3
  language: ne
  ct2_subfolder: ct2-fp16
  prefix_tokens: ["<|mixed|>", "<|verbatim|>"]

# Judge instructions — DRAFT, needs native-speaker review.
prompt_file: config/prompts/ne_survey.yaml

# Guards: Devanagari + Latin (genuine English code-switches) are allowed; any
# other script in the output is a hallucination and is blanked.
scripts: [DEVANAGARI, LATIN]
unclear_marker: "[अस्पष्ट]"
