[project]
name = "asr-pipeline"
version = "0.1.0"
description = "Fully-local Bengali survey ASR: two-witness fusion (titu + Whisper) reconciled by a local LLM judge, with translation, speaker roles and a QA worklist; plus a general multilingual path"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Noureini Sayouti" }]

dependencies = [
    # Audio processing
    "torchaudio==2.8.0",  # MUST match torch minor exactly; >= let uv pull 2.11.0 -> ABI crash (undefined symbol: torch_library_impl)
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "noisereduce>=0.1.2",
    "silero-vad>=5.0",
    # ASR engines
    "faster-whisper>=1.0.0",
    # Speaker diarization
    # Pinned to 3.x — pyannote 4.0 requires numpy>=2.0 which conflicts
    # with fairseq2 (omnilingual-asr dependency, needs numpy<2.0).
    # Upgrade when fairseq2 adds numpy 2.0 support.
    "pyannote.audio>=3.1.0,<4.0.0",
    # Translation
    "transformers>=4.36.0",
    "sentencepiece>=0.1.99",
    "ctranslate2>=4.0.0",
    # LLM post-processing
    "ollama>=0.4.0",
    # Configuration & CLI
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    # Utilities
    "torch==2.8.0",  # pinned: fairseq2 0.6 + torchaudio 2.8.0 + torchvision 0.23 are matched to this
    "python-dotenv>=1.0.0",
    "bitsandbytes>=0.49.2",
    "accelerate>=1.12.0",
    "openpyxl>=3.1.5",
    "onnxruntime>=1.24.1",
    "librosa>=0.11.0",
    "huggingface-hub>=0.36.2",
    "speechbrain>=1.0.3",
    "nvidia-cudnn-cu12>=9.10.2.21",
    "nemo-toolkit[asr]>=2.7.3",  # titu FastConformer-CTC (Bengali witness #1)
    # onnx 1.19+ needs ml_dtypes>=0.5 -> numpy>=2.1, conflicting with fairseq2.
    "onnx<1.19.0",
    # pyarrow 26+ (via NeMo -> datasets) requires numpy>=2; numpy stays 1.x for
    # fairseq2 (multilingual extra). Without this cap NeMo fails to import.
    "pyarrow<26",
    "llama-cpp-python>=0.3.31",
]

[project.optional-dependencies]
# General multilingual path (1,600+ languages). Pulls fairseq2 and kenlm;
# kenlm builds from source, so this extra needs a C/C++ compiler
# (sudo apt install build-essential zlib1g-dev libbz2-dev liblzma-dev).
multilingual = [
    "omnilingual-asr>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
asr-pipeline = "asr_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/asr_pipeline/default.yaml" = "asr_pipeline/default.yaml"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Prebuilt CUDA wheels for llama-cpp-python (GGUF/Gemma backend). The
# default PyPI wheel is CPU-only; this index ships GPU builds. cu124 runs
# on the cu128 driver (wheel bundles its own CUDA runtime). "explicit"
# means ONLY llama-cpp-python is pulled from here (see [tool.uv.sources]).
[[tool.uv.index]]
name = "llama-cpp-cuda"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform != 'darwin'" },
]
# GPU build on x86_64 Linux/WSL; CPU wheel from PyPI elsewhere (mac/arm).
llama-cpp-python = [
  { index = "llama-cpp-cuda", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
