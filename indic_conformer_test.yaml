# =============================================================================
# IndicConformer (AI4Bharat) ASR-only test config
# =============================================================================
# Same preprocessing + pyannote diarization + MMS_FA alignment as the titu
# config, but swaps the ASR engine to ai4bharat/indic-conformer-600m-multilingual
# (open, local, 22 Indic languages, RNNT decoder).
#
# Post-processing (TigerLLM correction + translation) is DISABLED so the run
# finishes fast and produces a clean ASR transcript (<stem>.raw.txt) for a
# pure ASR A/B against titu — both scored against the GT docx.
# =============================================================================

pipeline:
  device: "cuda"
  compute_type: "float16"
  batch_size: 8
  num_workers: 4
  output_dir: "./outputs/asr_ab"
  low_vram: true
  force_engine: "indic_conformer"
  indic_conformer_decoder: "ctc"   # "rnnt" (more accurate) or "ctc" (faster)

preprocessing:
  target_sample_rate: 16000
  mono: true
  loudness_normalization:
    enabled: false
  vad:
    enabled: true
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 100
  chunking:
    max_duration_s: 15
    overlap_s: 2
  noise_reduction:
    enabled: false

diarization:
  backend: "pyannote"
  model: "pyannote/speaker-diarization-3.1"
  min_speakers: 2
  max_speakers: 4
  min_segment_duration: 0.5

alignment:
  enabled: true   # MMS_FA word-level forced alignment

# ---------------------------------------------------------------------------
# Post-processing DISABLED for the ASR-only comparison.
# correction_backend "none" → no LLM correction.
# translation_backend "ct2_nllb" (legacy path) with translation + refinement
# both disabled → postprocessing is a no-op. The ASR transcript is written
# at stage 5b regardless, so we still get <stem>.raw.txt fast.
# ---------------------------------------------------------------------------
postprocessing:
  correction_backend: "none"
  translation_backend: "ct2_nllb"
  translation:
    enabled: false
  refinement:
    enabled: false

output:
  format: "all"
  transcription_style: "intelligent_verbatim"
  include_raw_text: true
  include_translation: false
  timestamp_format: "HH:MM:SS"
