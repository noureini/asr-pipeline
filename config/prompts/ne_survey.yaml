# =============================================================================
# Prompt templates — Nepali household survey  ·  DRAFT, NEEDS NATIVE REVIEW
# =============================================================================
# Adapted from config/prompts/bn_survey.yaml (same structure, roles, number and
# output rules). Before production use, a native Nepali speaker should review:
#   [ ] DOMAIN PRIORS — terms and the shocks list for YOUR survey instrument
#       and region (add dialect forms the witnesses tend to mishear)
#   [ ] NUMBERS — number words and the Bikram Sambat year rule
#   [ ] the placeholders [नाम] / [स्थान] / [अस्पष्ट]
# Then validate on 20-30 real segments (see README, "Adding a language").
#
# Differences from the Bengali prompt, on purpose:
#   - The AI Lab witnesses output NO punctuation and spell numbers as words,
#     so sentence breaks come from the judge, not from FLUENT.
#   - Both witnesses already write English code-switches in Latin script.
#
# Placeholders use $name syntax (Python string.Template):
#   fusion_prompt : $literal    $fluent
# =============================================================================

fusion_prompt: |
  You reconstruct ONE utterance from a household survey interview in Nepal. The speaker uses colloquial spoken Nepali and may mix in English words. The inputs carry internal labels — treat them as scaffolding and output only the spoken words.

  You get two noisy machine readings of the SAME audio, both in Nepali (Devanagari) with English words in Latin script, without punctuation. Produce a better reconciliation, not a copy of either:
  - LITERAL = a CTC transcriber: acoustically literal, weak language model, so it preserves how an unusual word actually SOUNDED rather than normalizing it. May be garbled or run-together where unsure. Trust it for names, numbers, rare/dialect words.
  - FLUENT = a seq2seq transcriber: well-formed grammar and structure, but its strong language model can swap a content word for a plausible WRONG one. May list candidates (a)/(b)/(c); pick the one whose form best matches LITERAL given context.
  Conflict rule (procedure, in order): (1) take FLUENT's word order and clause structure as the skeleton, and add the sentence breaks yourself (। or ?) — neither reading has punctuation; (2) clause by clause, take the content word from LITERAL where the two differ — UNLESS the FLUENT candidates (a)/(b)/(c) agree with each other AND LITERAL is garbled/unintelligible at that span, in which case take the FLUENT consensus (several FLUENT readings agreeing outweigh a single garbled LITERAL); (3) keep FLUENT's structure while taking LITERAL's word choices where LITERAL is the clearer reading; keep every content word grounded in at least one witness.

  DOMAIN PRIORS (household-roster + shocks instrument; prefer these when the reading is ambiguous):
  - परिवार/घरधुरी = household; सदस्य = member; खेती/कृषि = farming; अधिया = sharecropping; ज्याला/दैनिक ज्याला = daily wage; वैदेशिक रोजगार = foreign employment; रेमिट्यान्स = remittance
  - shocks: बाढी flood, पहिरो landslide, खडेरी drought, भूकम्प earthquake, असिना hailstorm, बाली नष्ट हुनु = crop destroyed
  - years are usually Bikram Sambat (e.g. २०८० = 2080 BS): keep the year as spoken; in [en] write it as "2080 BS"

  NAMES/PII: spoken personal names → [नाम]/[name]; place names verbatim if clear, else [स्थान]/[place]. For a garbled name, output the placeholder [नाम]/[name].

  NUMBERS (critical, BOTH lines): render each number exactly as spoken, digit for digit; mark any number you cannot make out as [अस्पष्ट]/[unclear]. Parse by structure: डेढ=1.5, अढाई=2.5, साढे X = X.5; सय = ×100 (अढाई सय=250); हजार=×1000; लाख=×100000; करोड=×10000000.

  SCRIPT: write every word in Devanagari, keeping only genuine English code-switches (NGO, loan, bank name, program) in Latin. If unsure whether a word is English, write it in Devanagari. For an unclear Nepali word, keep it in Devanagari or mark [अस्पष्ट].

  ROLES: label each speaker turn from WHAT IS SAID. ENUMERATOR = the interviewer: asks the survey questions, reads the consent/recording script, gives instructions, probes. RESPONDENT = the interviewee: answers, describing their own family, livelihood, age, floods, landslides, crops, money, land. Most utterances are one turn. When the utterance holds a question AND its answer, write two turns in spoken order, splitting only where the speaker changes and keeping every word in exactly one turn.

  Output a strippable <think> block (1–2 short sentences, no more), then one labelled turn per speaker, each turn exactly three lines:
  <think> who is speaking + what's asked/answered (and where the turn changes, if it does); any content word you overrode and why — keep it to 1–2 short sentences </think>
  @ENUMERATOR or @RESPONDENT
  [ne] clean coherent Nepali reconciling both readings; unrecoverable → [अस्पष्ट]
  [en] natural meaning-faithful English of YOUR [ne]; render it entirely in English, keeping only genuine code-switches (place/proper names); unrecoverable → [unclear]
  On the [ne] and [en] lines, write ONLY the final reconciled text as plain prose; put any reasoning, arrows, or alternatives in the reasoning block above.

  LITERAL: $literal
  FLUENT (candidate readings): $fluent
