# =============================================================================
# titu Bengali ASR + TigerLLM correction — production pipeline config
# =============================================================================
# Wires titu (Bengali FastConformer-CTC) into the existing production
# pipeline (preprocessing + pyannote diarization + MMS_FA forced alignment
# + correction + translation + formatter). TigerLLM-9B replaces Qwen as
# the local GGUF correction model — Bengali-fluent + instruction-tuned.
# =============================================================================

pipeline:
  device: "cuda"
  compute_type: "float16"
  batch_size: 8
  num_workers: 4
  output_dir: "./outputs/v1_deliverable"
  low_vram: true
  # Force route: all non-high-resource languages → titu engine.
  # We only process Bengali in this study so this is fine.
  force_engine: "titu"

preprocessing:
  target_sample_rate: 16000
  mono: true
  loudness_normalization:
    enabled: false
  vad:
    enabled: true
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 100
  chunking:
    max_duration_s: 15
    overlap_s: 2
  noise_reduction:
    enabled: false

diarization:
  backend: "pyannote"
  model: "pyannote/speaker-diarization-3.1"
  min_speakers: 2
  max_speakers: 4
  min_segment_duration: 0.5

alignment:
  enabled: true   # MMS_FA word-level forced alignment

# ---------------------------------------------------------------------------
# Post-processing: correction (TigerLLM via GGUF) + translation
# ---------------------------------------------------------------------------
postprocessing:
  correction_backend: "qwen"      # uses the qwen_corrector block below
  translation_backend: "qwen"     # uses the qwen_translator block

  qwen_corrector:
    enabled: true
    backend: "gguf"
    gguf_repo: "mradermacher/TigerLLM-9B-it-GGUF"
    gguf_file: "TigerLLM-9B-it.Q4_K_M.gguf"
    preserve_register: true       # keep colloquial/regional forms

  qwen_translator:
    enabled: true
    backend: "gguf"
    gguf_repo: "mradermacher/TigerLLM-9B-it-GGUF"
    gguf_file: "TigerLLM-9B-it.Q4_K_M.gguf"

output:
  format: "all"                   # txt + json + srt
  transcription_style: "intelligent_verbatim"
  include_raw_text: true
  include_translation: true
  timestamp_format: "HH:MM:SS"
